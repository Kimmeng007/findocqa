[project]
name = "findocqa"
version = "0.1.0"
description = "Agentic RAG system for SEC financial filings, evaluated against FinanceBench"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pymongo>=4.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.3",
    "faiss-cpu>=1.9",
    "google-genai>=1.2",
    "pandas>=2.2",
    "rank-bm25>=0.2",
    "ragas>=0.2",
    "langchain-google-vertexai>=2.0",
    "datasets>=3.0",
    "mlflow>=2.17",
    "jsonref>=1.1.0",
    "langgraph>=1.0.1",
    "streamlit>=1.63.0",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# torch (pulled in transitively by sentence-transformers) ships GPU/CUDA
# support by default on Linux -- ~1.5GB+ of nvidia-* packages this project
# never uses, since embeddings/reranking only ever run on CPU
# (retrieval/embeddings.py, retrieval/reranker.py). Found via a real
# Docker build: the image came out at 9.32GB before this fix. Windows
# isn't affected (its default torch wheel doesn't bundle these), which is
# why this didn't show up in local dev.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findocqa"]
