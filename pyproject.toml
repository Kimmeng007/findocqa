[project]
name = "findocqa"
version = "0.1.0"
description = "Agentic RAG system for SEC financial filings, evaluated against FinanceBench"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pymongo>=4.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.3",
    "faiss-cpu>=1.9",
    "google-genai>=1.2",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findocqa"]
